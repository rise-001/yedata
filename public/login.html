<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 余额哨兵</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=1.8.0">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-brand" aria-label="余额哨兵">
      <span class="brand-mark">Y</span>
      <div>
        <strong>余额哨兵</strong>
        <small>MULTI-SITE BALANCE MONITOR</small>
      </div>
    </section>
    <form class="login-card" id="loginForm">
      <div>
        <div class="eyebrow">SECURE ACCESS</div>
        <h1>登录管理后台</h1>
        <p>使用服务器配置的管理员账号和密码。</p>
      </div>
      <label>管理员账号<input id="adminUsername" autocomplete="username" value="admin" autofocus required></label>
      <label>管理员密码<input id="adminPassword" type="password" autocomplete="current-password" required></label>
      <small class="login-error" id="loginError" role="alert"></small>
      <button class="primary-btn login-submit" id="loginSubmit" type="submit"><span>登录</span><b>→</b></button>
    </form>
  </main>
  <script src="/login.js?v=1.8.0"></script>
</body>
</html>
