<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余额哨兵</title><link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"><link rel="stylesheet" href="/styles.css?v=1.10.0">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><div class="brand"><span class="brand-mark">Y</span><span>余额哨兵</span></div><div class="side-label">工作区</div><nav><a class="nav-item active" href="#dashboard" data-view="dashboard"><span class="nav-icon">◈</span>余额概览</a><a class="nav-item" href="#sites" data-view="sites"><span class="nav-icon">⌘</span>站点设置</a></nav><div class="sidebar-footer"><div class="secure-dot"></div><div><strong>本地运行</strong><small>凭据不会写入服务器</small></div></div></aside>
    <main class="main-content" id="dashboard">
      <header class="topbar"><div><div class="eyebrow">MULTI-SITE BALANCE MONITOR</div><h1 id="pageTitle">余额概览</h1></div><div class="top-actions"><span class="last-sync" id="lastSync">尚未检查</span><button class="link-btn" id="logoutBtn" type="button">退出</button><button class="icon-btn" id="refreshBtn" title="刷新余额数据">↻</button></div></header>
      <div class="app-view active" id="dashboardView">
      <section class="summary-grid"><article class="summary-card"><span>监控站点</span><strong id="siteCount">1</strong><small>已配置站点</small></article><article class="summary-card"><span>正常余额</span><strong id="healthyCount">--</strong><small>高于预警阈值</small></article><article class="summary-card warning"><span>需要关注</span><strong id="warningCount">--</strong><small>低于阈值或检查失败</small></article><article class="summary-card accent"><span>最近检查</span><strong id="checkedCount">0</strong><small>本次完成数量</small></article></section>
        <section class="balance-dashboard"><div class="dashboard-head"><div><span class="section-index">看板</span><h2>网站余额</h2></div><span id="dashboardUpdated">等待后端检查</span></div><div class="dashboard-table-wrap"><table class="dashboard-table"><thead><tr><th>网站</th><th>可用余额</th><th>预警线</th><th>状态</th><th>查询间隔</th><th>最近检查</th><th>操作</th></tr></thead><tbody id="dashboardBody"></tbody></table><div class="dashboard-empty" id="dashboardEmpty">保存站点配置后，这里会显示余额数据。</div></div></section>
      </div>
      <section class="sites-section app-view" id="sitesView"><div class="section-toolbar"><div><span class="section-index">设置</span><h2>监控站点</h2><p>每个站点使用独立账号和预警规则</p></div><div class="toolbar-actions"><button class="secondary-btn" id="addSiteBtn" type="button">＋ 添加站点</button><button class="primary-btn compact" id="checkAllBtn" type="button"><span>检查全部</span><b>→</b></button></div></div><section class="global-notify-panel" aria-labelledby="globalNotifyTitle"><div><strong id="globalNotifyTitle">企业微信通知</strong><small>所有站点共用此 Webhook，各站点可单独启用或停用预警</small></div><label>全局 Webhook<input id="globalWebhook" type="password" autocomplete="off" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?..."></label><button class="secondary-btn" id="testGlobalNotify" type="button">测试通知</button><span id="globalNotifyResult" class="notify-result"></span></section><div id="sitesList"></div></section>
      <footer class="page-footer"><span>余额哨兵 v1.10 · 多站点</span><span>服务端状态 <i class="online-dot"></i><strong>正常</strong></span></footer>
    </main>
  </div>
  <template id="siteTemplate"><article class="site-card"><div class="site-card-head"><div class="site-title"><span class="site-number"></span><input class="site-name" placeholder="站点名称" maxlength="40"><span class="site-state">待检查</span></div><div class="site-actions"><button class="link-btn check-one" type="button">检查</button><button class="link-btn danger remove-site" type="button" title="删除站点">删除</button></div></div><div class="site-result"><div class="site-balance"><span>可用余额</span><strong class="site-balance-value">--</strong><small>CNY · <b class="site-account">未连接</b></small></div><div class="site-frozen"><span>冻结余额</span><strong class="site-frozen-value">--</strong><small>CNY</small></div><div class="site-last"><span>最近状态</span><strong class="site-status">等待检查</strong><small class="site-error"></small></div></div><div class="site-fields"><label>接口地址<input class="base-url" type="url" value="https://ezaiclub.com" required></label><label>时区<select class="timezone"><option>Asia/Shanghai</option><option>UTC</option><option>Asia/Tokyo</option></select></label><label>登录路径<input class="login-path" value="/api/v1/auth/login"></label><label>余额路径<input class="me-path" value="/api/v1/auth/me"></label><label>账号 / 邮箱<input class="email" autocomplete="username" placeholder="name@example.com"></label><label>密码<input class="password" type="password" autocomplete="current-password" placeholder="输入密码"></label><label class="wide-field token-field">Bearer Token（可选）<input class="token" type="password" autocomplete="off" placeholder="填写后可跳过账号密码"></label><label class="wide-field cookie-field hidden-field">登录 Cookie<textarea class="session-cookie" rows="2" autocomplete="off" spellcheck="false" placeholder="从目标网站复制完整 Cookie 字符串"></textarea></label><label>预警阈值<input class="threshold" type="number" min="0" step="0.01" value="100"></label></div><div class="site-footer"><label class="switch-label"><input class="notify-enabled" type="checkbox" checked><span class="switch"></span>启用预警</label></div></article></template>
  <div class="toast" id="toast" role="status"></div><script src="/app.js?v=1.10.0"></script>
</body></html>
